<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>picoCAD2 minimal</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
      }

      #view {
        display: block;
        width: 100vw;
        height: 100vh;
        image-rendering: pixelated;
      }

      #hud {
        position: fixed;
        top: 12px;
        left: 14px;
        font: 20px/1.2 monospace;
        color: #fff;
        text-shadow: 0 2px 0 #000;
        letter-spacing: 2px;
        user-select: none;
        pointer-events: none;
      }
    </style>
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=2" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
