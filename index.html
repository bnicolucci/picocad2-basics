<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>picoCAD2 minimal</title>

    <!-- THE page config — the single source of truth. It lives here (not in a
         JS module) so the inline script below can size and colour the canvas
         during HTML parse, before the very first paint: modules load hundreds
         of ms later in dev, and a config applied from one always flashes.
         src/run.ts reads the runtime bits (retroScale, background). -->
    <script>
      var PAGE = {
        width: 800,             // canvas size in CSS px; 0 both: fill window
        height: 600,
        retroScale: 0.5,        // pixelation: 0.25 = picoCAD2's own viewport
        background: '#1d2b53',  // scene clear colour (and canvas placeholder)
        pageBackground: '#111'  // page colour framing the canvas
      };
    </script>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        display: grid;
        place-items: center;
      }

      #view {
        display: block;
        image-rendering: pixelated;
      }

      #hint {
        position: fixed;
        bottom: 10px;
        left: 14px;
        font: 12px/1.2 monospace;
        color: rgba(255, 255, 255, 0.6);
        text-shadow: 0 1px 0 #000;
        user-select: none;
        pointer-events: none;
      }
      #hint:empty {
        display: none;
      }
    </style>

    <script>
      // Turn PAGE into CSS now, during parse, so the first paint is already
      // the right size and colour.
      (function (p) {
        var css =
          p.width && p.height
            ? '#view{width:' + p.width + 'px;height:' + p.height + 'px}'
            : '#view{width:100vw;height:100vh}';
        css += '#view{background:' + p.background + '}';
        if (p.pageBackground) css += 'body{background:' + p.pageBackground + '}';
        var style = document.createElement('style');
        style.textContent = css;
        document.head.appendChild(style);
      })(PAGE);
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=2" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <script>
      // Pre-size the drawing buffer to exactly what the renderer will use, so
      // the first WebGL frame needs no buffer resize — otherwise the default
      // 300x150 buffer (2:1) briefly composites stretched into the 4:3 box.
      (function (p, c) {
        var s = (p.retroScale || 0.5) * Math.min(window.devicePixelRatio || 1, 2);
        var w = p.width && p.height ? p.width : innerWidth;
        var h = p.width && p.height ? p.height : innerHeight;
        c.width = Math.max(1, Math.floor(w * s));
        c.height = Math.max(1, Math.floor(h * s));
      })(PAGE, document.getElementById('view'));
    </script>
    <div id="hint">WASD / arrows: move &nbsp;·&nbsp; Z: shoot &nbsp;·&nbsp; X: bounce</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
