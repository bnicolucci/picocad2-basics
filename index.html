<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>picoCAD2 minimal</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        display: grid;
        place-items: center;
      }

      /* Pre-JS placeholder matching the run() config in src/main.ts, so the
         first paint is already the right size and colour — otherwise the
         canvas sits at the browser default (300x150) until the modules load,
         then visibly snaps. run() re-applies the size from its config. */
      #view {
        display: block;
        width: 800px;
        height: 600px;
        background: #1d2b53;
        image-rendering: pixelated;
      }
    </style>
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=2" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
